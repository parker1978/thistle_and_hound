<!-- @dsCard group="Colors" viewport="700x150" name="Semantic Surfaces & Status" subtitle="Page/surface/border roles, plus success, warning, danger, info" -->
<link rel="stylesheet" href="../styles.css">
<div style="height:150px;display:flex;flex-direction:column;gap:8px;font:var(--font-caption);color:var(--color-text-soft)">
<div style="display:flex;gap:8px;flex:1">
<div style="flex:1;background:var(--color-page);border:var(--border-hairline);display:flex;align-items:flex-end;padding:6px">page</div>
<div style="flex:1;background:var(--color-surface);border:var(--border-hairline);display:flex;align-items:flex-end;padding:6px">surface</div>
<div style="flex:1;background:var(--color-surface-alt);border:var(--border-hairline);display:flex;align-items:flex-end;padding:6px">surface-alt</div>
<div style="flex:1;background:var(--color-surface-sunken);border:var(--border-hairline);display:flex;align-items:flex-end;padding:6px">sunken</div>
</div>
<div style="display:flex;gap:8px;flex:1">
<div style="flex:1;background:var(--color-success-soft);color:var(--color-success);display:flex;align-items:center;justify-content:center;border-radius:var(--radius-sm)">success</div>
<div style="flex:1;background:var(--color-warning-soft);color:var(--color-warning);display:flex;align-items:center;justify-content:center;border-radius:var(--radius-sm)">warning</div>
<div style="flex:1;background:var(--color-danger-soft);color:var(--color-danger);display:flex;align-items:center;justify-content:center;border-radius:var(--radius-sm)">danger</div>
<div style="flex:1;background:var(--color-info-soft);color:var(--color-info);display:flex;align-items:center;justify-content:center;border-radius:var(--radius-sm)">info</div>
</div>
</div>
