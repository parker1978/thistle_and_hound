# Cloudflare Worker settings. The Worker serves the static site from this folder and runs
# the giveaway API (server/worker.js) for /api/* requests.
name = "thistle-and-hound"
main = "server/worker.js"
compatibility_date = "2026-09-01"

[assets]
directory = "."
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "thistle-giveaway"
database_id = "ac39a49a-ce50-40f2-aaf2-a97046a3a9f5"
migrations_dir = "migrations"
